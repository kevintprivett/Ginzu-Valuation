name: Monthly ERP Update
permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: '0 0 5 * *' # Monthly on the fifth at midnight
  workflow_dispatch:
  
jobs:
  erp-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.x'

      - name: Get current date
        id: date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Pipeline/requirements.txt
      
      - name: Run ERP update script
        working-directory: ./Pipeline
        run: python erp_update.py
      
      - name: Create Pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GINZU_PULL_REQUEST_TOKEN }}
          commit-message: Monthly ERP Update - ${{ steps.date.outputs.DATE }}
          branch: erp-update-${{ steps.date.outputs.DATE }}
          title: Monthly ERP Update - ${{ steps.date.outputs.DATE }}
          body: |
            This PR updates the Equity Risk Premium (ERP) data used in the Ginzu application.
            The ERP has been updated to reflect the latest market conditions as of ${{ steps.date.outputs.DATE }}.
          base: main
          labels: automated-update